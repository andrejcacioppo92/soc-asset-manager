# URL del database, default su localhost per lo sviluppo locale
# in CI o produzione si sovrascrive con la variabile DB_URL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cyber_asset_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

gemini.api.key=${GEMINI_API_KEY}